<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kNN Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<h1>kNN(K- Nearest Neighbour) Calculator</h1>
<p class="sub">Fill in your own training data, classes and query point...</p>

<section>
<h2>Settings</h2>
<div class="opts">
<label class="f">k (neighbors)<input type="number" id="k" min="1" step="1" placeholder="e.g. 2,3.."></label>
<label class="f">Distance<select id="metric"><option value="euclid">Euclidean (L2)</option><option value="manh">Manhattan (L1)</option><option value="mink">Minkowski (Lp)</option></select></label>
<label class="f" id="pbox" hidden>p<input type="number" id="p" min="1" step="any" value="3"></label>
<label class="f">Scaling<select id="norm"><option value="none">None (use raw values)</option><option value="z">Z-score</option><option value="mm">Min-max</option></select></label>
</div>
</section>

<section>
<h2>Training data</h2>
<div class="scroll"><table id="tbl"></table></div>
<div class="bar">
<button id="addRow">+ Row</button>
<button id="addCol">+ Column</button>
<button id="reset" style="background: red;color: azure;">Clear all</button>
<span class="note">Orange row = query point Q.</span>
</div>
<div class="bar"><button class="go" id="calc">Calculate</button></div>
<div class="err" id="err" role="alert"></div>
</section>

<section id="out" hidden>
<h2>Result</h2>
<div id="res"></div>
</section>
</main>

<script src="script.js"></script>
</body>
</html>
